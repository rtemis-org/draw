# Published dependency identities are immutable; the binding version comes from
# DESCRIPTION. Unreleased changes require clean documentation builds.
# Recorded script fingerprints are checked by test-widget_dependencies.R.
dependencies:
  - name: echarts
    version: 6.1.0
    src: htmlwidgets/lib/echarts
    script: echarts.min.js
  - name: rtemis-draw-renderers
    version: 1.7.0
    src: htmlwidgets/lib/draw
    script:
      - renderers.js
      - scatter3d.js
  - name: rtemis-panel-layout
    version: 1.0.13
    src: htmlwidgets/lib/draw
    script:
      - panels.js
      - a3.js
      - panel_widget.js
  - name: rtemis-vector-theme
    version: 2.0.0
    src: htmlwidgets/lib/draw
    script: vector_theme.js
  - name: rtemis-draw-builders
    version: 0.10.3
    src: htmlwidgets/lib/draw
    script: rtemis-draw-builders.js
  - name: rtemis-theme-watch
    version: 1.0.0
    src: htmlwidgets/lib/draw
    script: theme_watch.js
