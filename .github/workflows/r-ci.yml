name: R CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - r/**
      - .github/workflows/r-ci.yml
  push:
    branches:
      - main
    paths:
      - r/**
      - .github/workflows/r-ci.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: r-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r-cmd-check:
    name: ${{ matrix.config.os }} / R ${{ matrix.config.r }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60

    # Follow r-lib's standard platform matrix and retain the dependency floor.
    # All jobs exercise SVG export with the minimum supported Node runtime.
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: devel, http-user-agent: release}
          - {os: ubuntu-latest, r: oldrel-1}
          - {os: ubuntu-latest, r: '4.1'}
          - {os: windows-latest, r: release}
          - {os: macos-latest, r: release}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: actions/setup-node@v6
        with:
          node-version: '18.20.8'

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          extra-repositories: https://rtemis-org.r-universe.dev
      # Access latest packages on rtemis-org.r-universe.dev
      - name: Add rtemis r-universe to repos
        run: |
          cat(
            'options(repos = c(getOption("repos"), rtemisorg = "https://rtemis-org.r-universe.dev"))',
            file = "~/.Rprofile", sep = "\n", append = TRUE
          )
        shell: Rscript {0}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check
          cache-version: 1

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
