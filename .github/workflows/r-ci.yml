name: R CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - r/**
      - .github/workflows/r-ci.yml
      - .gitattributes
  push:
    branches: [main]
    paths:
      - r/**
      - .github/workflows/r-ci.yml
      - .gitattributes

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r-cmd-check:
    name: ubuntu-latest / R release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      # SVG tests require a Node runtime, separate from the Actions runtime.
      - uses: actions/setup-node@v6
        with:
          node-version: '18.20.8'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
          extra-repositories: https://rtemis-org.r-universe.dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check
          # Save dependencies even when a later check fails.
          cache: always
          cache-version: 1
      - uses: r-lib/actions/check-r-package@v2
        timeout-minutes: 20
        # Node.js tests skip on CRAN; run them here against the Node 18 floor.
        env:
          NOT_CRAN: "true"
        with:
          working-directory: r
          upload-snapshots: true
          error-on: '"warning"'
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
      - name: Preserve incomplete check diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: check-diagnostics
          path: r/check
          if-no-files-found: ignore
